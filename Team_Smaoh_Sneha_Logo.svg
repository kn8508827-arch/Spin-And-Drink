<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1536" height="1536" viewBox="0 0 1536 1536">
  <title>Team ស្មោះស្នេហ៍ Logo</title>
  <defs>
    <!-- Mask: show only a centered circle so corners become transparent -->
    <mask id="circleMask">
      <rect x="0" y="0" width="1536" height="1536" fill="black" />
      <!-- white = visible; adjust r slightly smaller than half to avoid edge artifacts -->
      <circle cx="768" cy="768" r="740" fill="white" />
    </mask>
  </defs>
  <image width="1536" height="1536"
         preserveAspectRatio="xMidYMid meet"
         mask="url(#circleMask)"
         href="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4U3lRXhpZgAATU0AKgAAAAgABQEaAAUAAAABAAAASgEbAAUAAAABAAAAUgEoAAMAAAABAAIAAAITAAMAAAABAAEAAIdpAAQAAAABAAAAWgAAALQAAABIAAAAAQAAAEgAAAA[...]">
</svg>
