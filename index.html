<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070818">
  <title>Cooler Drink 3D · Team ស្មោះស្នេហ៍</title>
  <link rel="icon" href="/assets/coolerbot-icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/neo.css?v=cb1">
  <script src="https://telegram.org/js/telegram-web-app.js" async></script>
</head>
<body>
  <div id="stage3d" aria-hidden="true"></div>

  <header class="top">
    <div class="brand"><img src="/assets/coolerbot-head-192.webp" alt="Cooler Bot"><b>COOLER<span> </span>DRINK</b></div>
    <div class="top-buttons">
      <button class="icon" id="musicBtn" type="button" aria-pressed="true" aria-label="ភ្លេង">🎵</button>
      <button class="icon" id="soundBtn" type="button" aria-pressed="true" aria-label="សំឡេង">🔊</button>
      <button class="icon" id="settingsBtn" type="button" aria-label="ការកំណត់">⚙️</button>
    </div>
  </header>

  <nav class="players" id="players" aria-label="អ្នកលេង"></nav>

  <footer class="bottom">
    <div class="turn" id="turn" aria-live="polite">ចុច SPIN ដើម្បីលេង 🎉</div>
    <button class="spin" id="spinBtn" type="button"><span>SPIN</span><small>បង្វិល</small></button>
    <div class="pool" id="pool" hidden></div>
  </footer>

  <div class="sheet-bg" id="addSheet" hidden>
    <form class="sheet small" id="addForm">
      <h3>👤 បន្ថែមអ្នកលេង</h3>
      <input id="addName" maxlength="24" autocomplete="off" placeholder="ឈ្មោះ" required>
      <div class="row"><button class="btn" type="button" id="addCancel">បោះបង់</button><button class="btn primary" type="submit">បន្ថែម</button></div>
    </form>
  </div>

  <div class="result-bg" id="result" hidden>
    <canvas id="confetti"></canvas>
    <section class="result-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <div class="who" id="resultWho"></div>
      <div class="big-emoji" id="resultEmoji">🎉</div>
      <h2 id="resultTitle"></h2>
      <p id="resultDesc"></p>
      <button class="btn primary" id="resultOk" type="button">OK 👍</button>
    </section>
  </div>

  <div class="sheet-bg" id="settings" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <header class="sheet-head"><h3 id="settingsTitle">⚙️ ការកំណត់</h3><button class="icon" id="settingsClose" type="button" aria-label="បិទ">✕</button></header>
      <h4>⏱️ រយៈពេលបង្វិល</h4>
      <div class="seg" id="durationSeg">
        <button type="button" data-d="3">៣ វិ</button><button type="button" data-d="5">៥ វិ</button><button type="button" data-d="7">៧ វិ</button><button type="button" data-d="10">១០ វិ</button>
      </div>
      <h4>🎡 ធាតុលើកង់</h4>
      <div class="items" id="items"></div>
      <form class="add-item" id="itemForm">
        <input id="itemEmoji" maxlength="4" value="✨" aria-label="Emoji">
        <input id="itemTitle" maxlength="24" placeholder="ធាតុថ្មី" required aria-label="ឈ្មោះធាតុ">
        <input id="itemColor" type="color" value="#7c4dff" aria-label="ពណ៌">
        <button class="btn primary" type="submit">＋</button>
      </form>
      <h4>👥 អ្នកលេង</h4>
      <div class="items" id="playerItems"></div>
      <div class="row"><button class="btn" id="resetWheel" type="button">↺ កង់ដើម</button></div>
      <p class="note">🍹 លេងសប្បាយ កុំបង្ខំគ្នាផឹក — ជ្រើសភេសជ្ជៈមិនមានជាតិអាល់កុលក៏បាន</p>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="loading" class="loading"><img src="/assets/coolerbot-head-192.webp" alt=""><span>LOADING…</span></div>

  <script src="/js/wheel-logic.js?v=cb1"></script>
  <script src="/js/cooler-bot.js?v=cb1" defer></script>
  <script src="/js/app3d.js?v=cb1" defer></script>
</body>
</html>
